services:
  # nginxリバースプロキシ（唯一の外部公開ポート）
  nginx:
    image: nginx:alpine
    ports:
      - "${FRONT_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front
      - back
    restart: unless-stopped

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: production
    expose:
      - "3030"
    environment:
      - INTERNAL_BACKEND_URL=http://back:8080
      - PORT=3030
      - NODE_ENV=production
    restart: unless-stopped

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - COEIROINK_API_URL=${COEIROINK_API_URL}
    command: uv run fastapi run src/main.py --host 0.0.0.0 --port 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
