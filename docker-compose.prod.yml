services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - front
      - back
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 60d; done'

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - PORT=3030
      - INTERNAL_BACKEND_URL=http://back:8080
      - COEIROINK_API_URL=${COEIROINK_API_URL:-https://coeiroink.yuma-dev.uk}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_TRUST_HOST=true
    expose:
      - "3030"
    depends_on:
      - back
    restart: always

  back:
    build:
      context: ./back
      dockerfile: Dockerfile.prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mathgirl}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - COEIROINK_API_URL=${COEIROINK_API_URL:-https://coeiroink.yuma-dev.uk}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-mathgirl}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  certbot-webroot:
  certbot-certs:
