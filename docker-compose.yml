services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "3030:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - back

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    volumes:
      - ./back:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mathgirl
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5450:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mathgirl
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
